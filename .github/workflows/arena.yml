name: LLM Trading Arena

on:
  schedule:
    # Weekdays at 15:30 UTC (~11:30am ET during DST) — one trading cycle per market day
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run trading cycle
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m arena run

      - name: Commit updated state and leaderboard
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data/ LEADERBOARD.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "arena: trading cycle $(date -u +%F)"
          git push origin main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pytest
      - run: python -m pytest tests/arena -q
      - run: python -m arena run --dry-run --state /tmp/arena-ci/state.json
